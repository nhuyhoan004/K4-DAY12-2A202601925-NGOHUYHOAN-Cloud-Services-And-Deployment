name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          API_TOKEN: ci-dummy
          REDIS_URL: "fake://"
        run: pytest --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t day12-chat .

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          # Gọi hook deploy của Render (nếu đã cài trong Github Secrets)
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          else
            echo "Bỏ qua deploy vì chưa có RENDER_DEPLOY_HOOK"
          fi
      - name: Smoke test
        run: |
          sleep 45
          # Kiểm tra healthz (nếu đã cài PUBLIC_URL trong Github Variables)
          if [ -n "${{ vars.PUBLIC_URL }}" ]; then
            curl -fsS "${{ vars.PUBLIC_URL }}/healthz"
          else
            echo "Bỏ qua smoke test vì chưa có PUBLIC_URL"
          fi
